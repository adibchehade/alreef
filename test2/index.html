<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markets · Cards (test 2)</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f4f6f9; --card:#fff; --txt:#16202a; --dim:#6b7785; --line:#e6eaef; --up:#0f9d58; --dn:#d93025; --up-bg:#e6f4ea; --dn-bg:#fce8e6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:18px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  .top h1 { margin:0; font-size:20px; font-weight:700; }
  .top .sub { color:var(--dim); font-size:13px; }
  .clock { margin-left:auto; text-align:right; }
  .clock b { font-size:22px; font-variant-numeric:tabular-nums; }
  .clock small { display:block; color:var(--dim); font-size:12px; }
  main { max-width:1180px; margin:0 auto; padding:22px 24px 40px; }
  h2 { font-size:16px; margin:26px 0 12px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr)); gap:14px; }
  .card { background:var(--card); border-radius:16px; padding:16px 18px; box-shadow:0 1px 3px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05); }
  .card .nm { display:flex; justify-content:space-between; align-items:baseline; color:var(--dim); font-size:13px; }
  .card .nm b { color:var(--txt); font-size:15px; }
  .card .v { font-size:26px; font-weight:700; margin:8px 0 6px; font-variant-numeric:tabular-nums; transition:color .6s; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; }
  .pill.up { color:var(--up); background:var(--up-bg); } .pill.dn { color:var(--dn); background:var(--dn-bg); } .pill.na { color:var(--dim); background:var(--line); }
  .v.flash-up { color:var(--up); } .v.flash-dn { color:var(--dn); }
  .tabs { display:inline-flex; background:#e8ecf1; border-radius:999px; padding:3px; }
  .tabs button { border:0; background:transparent; padding:6px 16px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer; color:var(--dim); }
  .tabs button.on { background:var(--txt); color:#fff; }
  .split { height:8px; border-radius:6px; background:var(--dn); overflow:hidden; margin:10px 0 6px; }
  .split i { display:block; height:100%; background:var(--up); }
  .ls { display:flex; justify-content:space-between; font-size:13px; }
  .ls .l { color:var(--up); } .ls .s { color:var(--dn); }
  .sum { background:var(--txt); color:#fff; }
  .sum .nm, .sum .nm b { color:#cbd3dc; }
  .note { color:var(--dim); font-size:13px; margin-top:14px; }
  .status { font-size:13px; color:var(--dim); }
  .status.err { color:var(--dn); }
</style>
</head>
<body>
<div class="top">
  <h1>Markets</h1>
  <span class="sub">Crypto · Anthropic · S&amp;P 500</span>
  <span class="status" id="status">Loading…</span>
  <div class="clock"><b id="clock">--:--:--</b><small id="date"></small></div>
</div>
<main>
  <div class="grid" id="px"></div>
  <h2>Liquidations
    <span class="tabs" id="tabs"><button data-w="24h" class="on">24 hours</button><button data-w="7d">7 days</button><button data-w="30d">30 days</button></span>
  </h2>
  <div class="grid" id="lq"></div>
  <div class="note" id="hist-note"></div>
  <div class="note">Prices: Binance (crypto) and Hyperliquid perps (Anthropic, S&amp;P 500). Liquidations: CoinBoss, futures/perps. Refreshes every 60 seconds. Not financial advice.</div>
</main>
<script src="/crypto/lib.js"></script>
<script>
  const A = window.ALREEF, $ = id => document.getElementById(id);
  A.clock($('clock'), $('date'));
  let L = null, W = '24h';
  const last = {};
  const pill = v => `<span class="pill ${v === null ? 'na' : v >= 0 ? 'up' : 'dn'}">${A.fmtPct(v)}</span>`;
  function drawLiq() {
    if (!L) return;
    const t = { l: 0, s: 0, t: 0 };
    const cards = A.ASSETS.map(a => {
      const x = L[a.sym][W]; t.l += x.long || 0; t.s += x.short || 0; t.t += x.total || 0;
      const sh = x.long !== null && x.short !== null && x.long + x.short > 0 ? x.long / (x.long + x.short) * 100 : 50;
      return `<div class="card"><div class="nm"><b>${a.name}</b><span>${a.sym}</span></div>
        <div class="v">${A.fmtUSD(x.total)}</div>
        <div class="split"><i style="width:${sh}%"></i></div>
        <div class="ls"><span class="l">Longs ${A.fmtUSD(x.long)}</span><span class="s">Shorts ${A.fmtUSD(x.short)}</span></div></div>`;
    });
    const sh = t.l + t.s > 0 ? t.l / (t.l + t.s) * 100 : 50;
    cards.unshift(`<div class="card sum"><div class="nm"><b>All assets</b><span>${W}</span></div>
      <div class="v">${A.fmtUSD(t.t)}</div><div class="split"><i style="width:${sh}%"></i></div>
      <div class="ls"><span class="l">Longs ${A.fmtUSD(t.l)}</span><span class="s">Shorts ${A.fmtUSD(t.s)}</span></div></div>`);
    $('lq').innerHTML = cards.join('');
    const b = L.BTC[W];
    $('hist-note').textContent = W !== '24h' && b.have < b.need
      ? `The ${W === '7d' ? '7' : '30'}-day total is still building up from the daily log: ${b.have} of ${b.need} days so far.` : '';
  }
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('tabs').querySelector('.on').classList.remove('on'); b.classList.add('on'); W = b.dataset.w; drawLiq();
  });
  async function refresh() {
    $('status').textContent = 'Updating…';
    const [P, LL] = await Promise.all([A.prices(), A.liquidations()]);
    L = LL;
    $('px').innerHTML = P.map(a => `<div class="card"><div class="nm"><b>${a.name}</b><span>${a.sym}</span></div>
      <div class="v" data-s="${a.sym}">${A.fmtPrice(a.price)}</div>${pill(a.chg)}</div>`).join('');
    P.forEach(a => {
      const el = document.querySelector(`.v[data-s="${a.sym}"]`);
      if (a.price !== null && last[a.sym] !== undefined && a.price !== last[a.sym]) {
        el.classList.add(a.price > last[a.sym] ? 'flash-up' : 'flash-dn');
        setTimeout(() => el.classList.remove('flash-up', 'flash-dn'), 1500);
      }
      if (a.price !== null) last[a.sym] = a.price;
    });
    drawLiq();
    const liqOk = A.ASSETS.some(a => L[a.sym]['24h'].total !== null), pxOk = P.some(a => a.price !== null);
    const s = $('status');
    s.className = 'status' + (liqOk && pxOk ? '' : ' err');
    s.textContent = (pxOk ? '' : 'Prices unavailable · ') + (liqOk ? '' : 'Liquidations unavailable · ') + 'Updated ' + A.spain({ hour: '2-digit', minute: '2-digit' });
  }
  A.every60(refresh);
</script>
</body>
</html>
