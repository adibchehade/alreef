name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          curl -s -m 25 -H 'Content-Type: application/json' -d '{"type":"metaAndAssetCtxs","dex":"xyz"}' https://api.hyperliquid.xyz/info | python3 -c "import sys,json
          m,c=json.load(sys.stdin); print('universe',len(m['universe']),'ctx',len(c))
          for u,x in zip(m['universe'],c):
            if any(k in u['name'].upper() for k in ('SP','500','US500','SPX')): print('HIT',u, {k:x.get(k) for k in ('funding','openInterest','markPx','prevDayPx')})"
