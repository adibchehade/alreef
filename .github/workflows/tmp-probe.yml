name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          now=$(($(date +%s)*1000)); start=$((now-6*3600*1000))
          for c in xyz:ANT xyz:SP500 BTC; do
            echo "=== hl candles $c"
            curl -s -m 25 -H 'Content-Type: application/json' -d "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"$c\",\"interval\":\"15m\",\"startTime\":$start,\"endTime\":$now}}" https://api.hyperliquid.xyz/info | head -c 400; echo
          done
          echo "=== hl 30d 4h count"
          curl -s -m 25 -H 'Content-Type: application/json' -d "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"xyz:SP500\",\"interval\":\"4h\",\"startTime\":$((now-30*86400*1000)),\"endTime\":$now}}" https://api.hyperliquid.xyz/info | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d), d[0]['t'] if d else None)"
          for r in 1h 4h 12h; do echo "=== coinboss coins range=$r"; curl -s -m 25 "https://www.coinboss.com/api/liquidations/coins?range=$r&limit=500" | python3 -c "import sys,json
          d=json.load(sys.stdin);print('range',d.get('range'),'err',d.get('error'));[print(x) for x in (d.get('data') or []) if x.get('coin') in ('BTC','ANT','SOL')]"; done
          echo "=== binance klines (US runner may be blocked)"; curl -s -m 15 'https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2' | head -c 300; echo
