name: tmp coinboss probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "coin=SPX" "symbol=SPXUSDT" "coin_base=SPX" "coin=SPX&limit=200" "coin=NDX100"; do
            echo "=== $q"
            curl -s -m 25 "https://www.coinboss.com/api/liquidations?$q" | python3 -c "import sys,json
          d=json.load(sys.stdin).get('data') or []; m=[r for r in d if r.get('coin_base') in ('SPX','NDX100')]
          print('rows',len(d),'spx/ndx rows',len(m)); seen=set()
          for r in m[:40]:
            k=(r['exchange'],r['symbol'])
            if k not in seen: seen.add(k); print('PRINT',k,r['price'])"
          done
