name: tmp coinboss probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "" "?range=24h" "?range=7d" "?range=30d" "?range=1h" "?window=7d" "?limit=500"; do
            echo "=== coins$q"
            curl -s -m 25 -H 'User-Agent: alreef-probe' "https://www.coinboss.com/api/liquidations/coins$q" | python3 -c "import sys,json
          d=json.load(sys.stdin); rows=d.get('data') or []
          print('range=',d.get('range'),'rows=',len(rows),'keys=',list(d.keys()))
          want={'BTC','ETH','BNB','SOL','XRP','ANT'}
          for r in rows:
            c=str(r.get('coin',''))
            if c in want or any(k in c.upper() for k in ('SP','500','SPX','US5','SPY','NDX','XYZ')): print(r)"
          done
